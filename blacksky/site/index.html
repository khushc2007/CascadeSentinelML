:root {
  color-scheme: dark;
  /* surfaces: near-black navy, layered graphite */
  --bg: #05070c; --bg-1: #0a0d14; --bg-2: #10141c; --bg-3: #161b25; --line: #1b212b; --line-2: #2a313d;
  --tx-1: #e8ecf1; --tx-2: #a8b1bd; --tx-3: #808a98;
  /* semantic hues: one meaning each */
  --ice: #7cc4e8; --ice-a: rgba(124,196,232,.13);           /* instrumentation, selection */
  --violet: #a68cf2; --violet-a: rgba(166,140,242,.14);      /* quantum states, algorithmic exploration */
  --amber: #f2a93b; --amber-a: rgba(242,169,59,.13);         /* warnings, stressed components */
  --red: #e0443a; --red-a: rgba(224,68,58,.13);              /* modelled faults, severe conditions */
  --green: #5fbf86; --green-a: rgba(95,191,134,.13);         /* generator online, checks passed */
  --grey: #565e69; --lamp: #ffd39a;                          /* inactive; served demand */
  /* categorical series for method comparisons (dataviz reference palette, dark steps, passed the palette checker on --bg-1) */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s7: #9085e9;
  --sans: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --bar: 52px; --dock: 96px; --panel: 344px; --r: 5px; --lw: 320px; --rw: 340px;
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--tx-1); font: 400 13px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.micro { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--tx-3); }
.faint { color: var(--tx-3); } .dim { color: var(--tx-2); }
a { color: var(--ice); }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
[hidden] { display: none !important; }
::selection { background: rgba(124,196,232,.3); }

  background: rgba(5,7,12,.94); border-bottom: 1px solid var(--line); z-index: 30; }

/* ---------- theater stage (Workspace 1) ---------- */
#stage { position: fixed; inset: calc(var(--bar) + var(--safe-t)) 0 calc(var(--dock) + var(--safe-b)) 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

.lbl { position: absolute; left: 0; top: 0; font: 500 11px/1 var(--mono); padding: 3px 5px; border-radius: 3px; background: rgba(10,13,20,.88); border: 1px solid var(--line-2); color: var(--tx-2); white-space: nowrap; }
.lbl.sel { color: var(--ice); border-color: var(--ice); } .lbl.hov { color: var(--tx-1); }
.lbl.out { color: var(--red); border-color: rgba(224,68,58,.6); } .lbl.trip { color: #f08a80; border-color: rgba(224,68,58,.4); }
.lbl.over { color: var(--amber); border-color: rgba(242,169,59,.45); } .lbl.isl { color: var(--tx-1); border-style: dashed; } .lbl.dark { color: var(--tx-3); }
#readout { position: absolute; top: 12px; left: calc(50% + var(--offx, 0px)); transform: translateX(-50%); display: flex; background: rgba(10,13,20,.92); border: 1px solid var(--line); border-radius: var(--r); pointer-events: auto; max-width: calc(100% - 32px); }

#readout .cell:last-child { border-right: 0; }
#readout .cell.src { max-width: 230px; } #readout .src .v { font: 500 12.5px/1.3 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 3px; }
#readout .v { font: 500 18px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
#readout .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--tx-3); white-space: nowrap; display: flex; gap: 4px; align-items: center; }
.lamp-bar { height: 3px; background: #1f1b16; border-radius: 2px; margin-top: 5px; overflow: hidden; } .lamp-bar i { display: block; height: 100%; background: var(--lamp); }
.panel { position: absolute; top: 12px; bottom: 12px; width: var(--panel); background: rgba(10,13,20,.95); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; z-index: 5; }
#left { left: max(12px, var(--safe-l)); } #right { right: max(12px, var(--safe-r)); }

.panel > header h2.serif { font: 400 22px/1 var(--serif); letter-spacing: .005em; } .panel > header h2.serif em { color: var(--tx-2); }
.panel .body { overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; overscroll-behavior: contain; }
.panel .body::-webkit-scrollbar, .pane-b::-webkit-scrollbar { width: 8px; } .panel .body::-webkit-scrollbar-thumb, .pane-b::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }

.kv dt { color: var(--tx-3); display: flex; gap: 5px; align-items: center; } .kv dd { margin: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--tx-1); min-width: 0; overflow-wrap: anywhere; }
.note { font-size: 12px; color: var(--tx-3); line-height: 1.5; margin: 0; }
.note b { color: var(--tx-2); font-weight: 500; }
.m-err { border: 1px solid rgba(224,68,58,.5); background: var(--red-a); color: #f3b5ae; border-radius: var(--r); padding: 8px 10px; font-size: 12.5px; }
.m-warn { border: 1px solid rgba(242,169,59,.45); background: var(--amber-a); color: #f4cf96; border-radius: var(--r); padding: 8px 10px; font-size: 12.5px; }
.m-ok { border: 1px solid rgba(95,191,134,.4); background: var(--green-a); color: #b5e3c8; border-radius: var(--r); padding: 8px 10px; font-size: 12.5px; }
.m-info { border: 1px solid var(--line-2); background: var(--bg-2); color: var(--tx-2); border-radius: var(--r); padding: 8px 10px; font-size: 12.5px; }
.m-q { border: 1px solid rgba(166,140,242,.4); background: var(--violet-a); color: #d6cbfb; border-radius: var(--r); padding: 8px 10px; font-size: 12.5px; }
.ev-badge { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--tx-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 2px 6px; font-family: var(--mono); }
.ib { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line-2); background: none; color: var(--tx-3); font: 600 10px/1 var(--mono); cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ib:hover { color: var(--ice); border-color: var(--ice); }
.brief { display: flex; flex-direction: column; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

.stages button .n { font: 500 10px var(--mono); color: var(--tx-3); } .stages button .t { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }

.stagecard h3 { margin: 0; font: 400 30px/1.05 var(--serif); letter-spacing: 0; }
.stagecard .lede { font-size: 14px; line-height: 1.5; color: var(--tx-1); margin: 0; text-wrap: pretty; }
.evline { border-left: 2px solid var(--line-2); padding: 2px 0 2px 10px; font-size: 12.5px; color: var(--tx-2); }
.evline b { color: var(--tx-1); font-weight: 500; display: block; } .evline .micro { display: block; margin-bottom: 2px; }
.evline.trip, .evline.initial_outage { border-color: var(--red); } .evline.overload { border-color: var(--amber); } .evline.islanding { border-color: var(--ice); } .evline.load_shed { border-color: var(--lamp); }

.metrics .v { font: 500 17px/1.2 var(--mono); font-variant-numeric: tabular-nums; } .metrics .k { font-size: 11.5px; color: var(--tx-3); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; flex: none; scrollbar-width: none; }
.tabs button { height: 35px; padding: 0 9px; border: 0; background: none; color: var(--tx-2); cursor: pointer; border-bottom: 2px solid transparent; font-size: 12.5px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--tx-1); border-bottom-color: var(--ice); }
.tabs.q button[aria-selected="true"] { border-bottom-color: var(--violet); }
.pane.left > .tabs { flex-wrap: wrap; overflow: visible; } .pane.left > .tabs button { padding: 0 8px; }

.list > button, .list > div { display: grid; grid-template-columns: 42px 1fr; gap: 8px; text-align: left; padding: 7px 9px; background: var(--bg-1); border: 0; border-bottom: 1px solid var(--line); color: var(--tx-2); cursor: pointer; font-size: 12.5px; min-width: 0; }
.list > :last-child { border-bottom: 0; }
.list > button:hover { background: var(--bg-2); color: var(--tx-1); }
.list > button[aria-current="true"] { background: var(--ice-a); color: var(--tx-1); box-shadow: inset 2px 0 0 var(--ice); }
.list .r { font: 500 11px var(--mono); color: var(--tx-3); padding-top: 1px; } .list .tt { color: var(--tx-1); } .list .dd { font-size: 11.5px; color: var(--tx-3); display: block; overflow-wrap: anywhere; }
.tag { display: inline-block; font: 500 10px var(--mono); padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line-2); color: var(--tx-2); vertical-align: 1px; }
.tag.trip, .tag.initial_outage { color: #f08a80; border-color: rgba(224,68,58,.45); } .tag.overload { color: var(--amber); border-color: rgba(242,169,59,.45); }
.tag.islanding { color: var(--ice); border-color: rgba(124,196,232,.45); } .tag.load_shed { color: var(--lamp); border-color: rgba(255,211,154,.4); } .tag.termination { color: var(--tx-1); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }

.chips button[aria-pressed="true"] { border-color: var(--ice); color: var(--ice); background: var(--ice-a); }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }

.tablewrap { overflow-x: auto; min-width: 0; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 34px; border-bottom: 1px solid var(--line-2); }
.spark i { flex: 1; background: var(--tx-3); min-height: 1px; max-width: 18px; } .spark i.w { background: var(--amber); opacity: .6; } .spark i.o { background: var(--amber); } .spark i.x { background: var(--red); height: 3px !important; }
textarea.md { width: 100%; min-height: 240px; resize: vertical; background: var(--bg); border: 1px solid var(--line-2); border-radius: var(--r); color: var(--tx-2); font: 11.5px/1.5 var(--mono); padding: 8px; }
.setchips { display: flex; flex-wrap: wrap; gap: 4px; }

/* APEX · motion grammar: workspaces arrive with a short fade (state change), nothing loops; off under reduced motion */
section.ws:not([hidden]) { animation: ws-in .2s ease-out both; } #stage:not([hidden]) { animation: fig-in .2s ease-out both; }
@keyframes ws-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes fig-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { section.ws:not([hidden]), #stage:not([hidden]) { animation: none; } }
/* APEX · landscape (Arena, ML) */
.ls-row { display: grid; grid-template-columns: minmax(0, 470px) minmax(220px, 1fr); gap: 18px; align-items: start; }
.ls-host { width: 100%; max-width: 470px; } .ls { position: relative; } .ls-c { display: block; cursor: crosshair; border: 1px solid var(--line); border-radius: 4px; touch-action: none; }
.ls-tip { position: absolute; z-index: 3; pointer-events: none; background: var(--bg-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 5px 8px; font-size: 11.5px; color: var(--tx-1); white-space: nowrap; }
.ls-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; } .ls-chips { display: flex; flex-wrap: wrap; gap: 4px; } .ls-chips .btn i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.ls-chips .btn[aria-pressed="false"] { opacity: .45; } .ls-key { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--tx-3); flex-wrap: wrap; } .ls-key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* APEX · severity context strip (Inspector → Run) */
.sv-wrap { position: relative; } .sv { width: 100%; height: auto; display: block; }
.sv-hit { position: absolute; top: 0; bottom: 12px; background: transparent; border: 0; padding: 0; cursor: pointer; } .sv-hit:hover, .sv-hit:focus-visible { background: rgba(124,196,232,.12); outline: none; }
.ln-node { cursor: pointer; } .ln-node:focus-visible circle { stroke: var(--ice); stroke-width: 2.5; }
.geo-row { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; } .geo-row svg { width: min(400px, 100%); height: auto; flex: none; } .geo-txt { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--tx-2); } .geo-txt p { margin: 0; }
/* APEX · briefing (guided tour driving the real interface) */
#brief-ring { position: fixed; z-index: 85; border: 2px solid var(--lamp); border-radius: 8px; pointer-events: none; box-shadow: 0 0 0 9999px rgba(3,5,9,.42); transition: all .35s ease; }
.brief { position: fixed; z-index: 86; left: 50%; transform: translateX(-50%); bottom: calc(18px + var(--safe-b)); width: min(560px, calc(100% - 32px)); background: var(--bg-1); border: 1px solid var(--line-2); border-radius: 10px; padding: 14px 16px 12px; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
.brief h3 { font: 400 26px/1.1 var(--serif); margin: 4px 0 6px; } .br-h { display: flex; justify-content: space-between; align-items: center; } .br-t { color: var(--tx-2); font-size: 13.5px; line-height: 1.5; margin: 0 0 12px; } .br-t b { color: var(--tx-1); }
.br-f { display: flex; gap: 8px; align-items: center; } .br-dots { display: flex; gap: 4px; margin-right: auto; } .br-dots i { width: 7px; height: 7px; border-radius: 2px; background: #262c36; } .br-dots i.done { background: #6b5a3c; } .br-dots i.on { background: var(--lamp); }
@media (prefers-reduced-motion: reduce) { #brief-ring { transition: none; } }
/* APEX · arrival (headline fact over the dimmed grid) and the lit-cell motif */
.lit-mark { display: inline-grid; grid-template-columns: 5px 5px; gap: 2px; margin-right: 9px; vertical-align: -1px; }
.lit-mark i { width: 5px; height: 5px; border-radius: 1px; background: var(--lamp); } .lit-mark i.off { background: #262c36; }
.arrival { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; overflow: auto; padding-block: 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(5,7,12,.62), rgba(5,7,12,.95) 72%); animation: ar-in .5s ease-out both; }
@keyframes ar-in { from { opacity: 0; } to { opacity: 1; } }
.ar-in { width: min(780px, 100%); }
.ar-kicker { font: 500 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--tx-3); display: flex; align-items: center; flex-wrap: wrap; }
.ar-num { font: 400 clamp(88px, 15vw, 172px)/.92 var(--serif); color: var(--lamp); margin: 14px 0 6px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.ar-num small { font-size: .42em; color: var(--tx-2); margin-left: 4px; }
.ar-lede { font-size: clamp(17px, 2.1vw, 21px); line-height: 1.45; color: var(--tx-2); max-width: 62ch; margin: 0 0 22px; text-wrap: pretty; } .ar-lede b { color: var(--tx-1); font-weight: 600; }
.ar-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
.ar-stats > div { background: rgba(10,13,20,.88); padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; } .ar-stats b { font: 500 26px/1 var(--mono); color: var(--tx-1); } .ar-stats span { font-size: 12px; color: var(--tx-3); }
.ar-cells { display: grid; grid-template-columns: repeat(auto-fill, 13px); gap: 3px; }
.ar-cells i { width: 13px; height: 13px; border-radius: 2px; --v: 1; background: color-mix(in srgb, var(--lamp) calc(var(--v) * 100%), #1c212b); transition: background-color .45s ease; }
.ar-cap { font-size: 11.5px; color: var(--tx-3); margin: 8px 0 22px; display: flex; gap: 4px 10px; align-items: center; flex-wrap: wrap; } #ar-round { font-family: var(--mono); color: var(--tx-2); }
.ar-acts { display: flex; gap: 10px; flex-wrap: wrap; } .ar-acts .btn { height: 40px; padding: 0 18px; font-size: 14px; }
.ar-foot { font-size: 11.5px; color: var(--tx-3); margin: 18px 0 0; max-width: 70ch; }
@media (max-width: 600px) { .arrival { background: rgba(5,7,12,.95); place-items: start center; } .ar-stats { grid-template-columns: 1fr; } .ar-stats > div { flex-direction: row; align-items: baseline; gap: 10px; } .ar-stats b { font-size: 20px; } }
@media (prefers-reduced-motion: reduce) { .arrival { animation: none; } .ar-cells i { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <a class="mark" href="#theater" aria-label="BLACKSKY Command, Grid Doomsday Finder"><span class="lit-mark" aria-hidden="true"><i></i><i></i><i class="off"></i><i></i></span><span class="mk-t"><b>BLACKSKY <i>COMMAND</i></b><span>Omega · cascade, quantum &amp; ML research instrument</span></span></a>
  <nav class="ws-nav" aria-label="Workspaces">
    <a href="#theater" data-ws="theater"><span class="full">Cascade </span>Theater <kbd>1</kbd></a>
    <a href="#quantum" data-ws="quantum">Quantum<span class="full"> Lab</span> <kbd>2</kbd></a>
    <a href="#arena" data-ws="arena"><span class="full">Algorithm </span>Arena <kbd>3</kbd></a>
    <a href="#ml" data-ws="ml">ML<span class="full"> Observatory</span> <kbd>4</kbd></a>
    <a href="#evidence" data-ws="evidence">Evidence<span class="full"> Lab</span> <kbd>5</kbd></a>
  </nav>
  <span class="sp"></span>
  <button class="chip" id="scn-chip" title="Active scenario (stable id). Click to inspect it."><span class="dot" id="scn-dot"></span><span id="scn-txt">no scenario</span></button>
  <label class="status">
    <select class="ctl" id="net-sel" aria-label="Benchmark network"><option value="ieee118">IEEE 118-bus</option><option value="ieee30">IEEE 30-bus</option><option value="ieee14">IEEE 14-bus</option></select></label>
  <span class="status">
    <span class="chip" id="model-chip" title="Cascade model configuration"><span>DC · all-overloaded</span></span>
    <span class="chip" id="eng-chip" title="Simulation status"><span class="dot" id="eng-dot"></span><span id="eng-txt">engine loading</span></span>
    <span class="chip" id="job-chip" title="Background computation" hidden><span class="dot wait"></span><span id="job-txt"></span></span>
    <span class="chip" id="api-chip" title="Optional Python API"><span class="dot" id="api-dot"></span><span id="api-txt">API: checking</span></span></span>
  <button class="btn sm" id="cmdk-btn" aria-haspopup="dialog" title="Command palette (Ctrl/⌘ K)">⌘K<span>&nbsp;Commands</span></button>
  <button class="btn icon ghost" id="help-btn" aria-label="Help, keyboard and controls" aria-haspopup="dialog">?</button>
</header>

<main id="stage" aria-label="Cascade Theater">
  <canvas id="gl" aria-label="3-D network view. Use the panels and timeline for keyboard access to every entity and event." role="img"></canvas>
  <svg id="svg2d" hidden role="img" aria-label="2-D schematic network view"></svg>
  <div id="labels" aria-hidden="true"></div>
  <div id="boot">Loading network data…</div>
  <div id="fatal" hidden></div>
  <div id="readout" aria-live="polite"></div>
  <aside class="panel" id="left" aria-label="Scenario panel"></aside>
  <aside class="panel" id="right" aria-label="Inspector"></aside>
  <div id="legend" aria-label="Legend"></div>
  <div class="minimap" id="minimap" title="Overview map: click to centre the camera there"><canvas id="mm" width="336" height="256"></canvas><span>Overview</span></div>
  <div id="layers"><button class="btn sm" id="layers-btn" aria-expanded="false" aria-haspopup="true">Layers</button><div class="menu" id="layers-menu" hidden></div></div>
</main>

<footer class="dock" aria-label="Playback">
  <div class="transport">
    <button class="btn icon ghost opt" id="tp-reset" aria-label="Reset to the start (Home)" title="Reset (Home)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2v10M12 2 5 7l7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="btn icon ghost" id="tp-back" aria-label="Previous event (Left arrow)" title="Previous event (←)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M11 2 4 7l7 5z" fill="currentColor"/></svg></button>
    <button class="btn icon play primary" id="tp-play" aria-label="Play (Space)" title="Play / pause (Space)"></button>
    <button class="btn icon ghost" id="tp-fwd" aria-label="Next event (Right arrow)" title="Next event (→)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="m3 2 7 5-7 5z" fill="currentColor"/></svg></button>
    <button class="btn icon ghost opt" id="tp-replay" aria-label="Replay from the start" title="Replay"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M11.5 7A4.5 4.5 0 1 1 7 2.5h2.5M8 0.5l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <select class="ctl" id="tp-speed" aria-label="Playback speed (display only; simulation has no physical time)" title="Playback speed changes only how fast recorded events are shown, not any simulated time" style="width:64px"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  </div>
  <div class="scrub"><div class="marks" id="marks"></div><div class="fill" id="fill"></div><input type="range" id="scrub" min="0" max="0" value="0" step="1" aria-label="Event timeline"></div>
  <div class="nowline" id="nowline"></div>
  <div class="camctl">
    <button class="btn sm" id="cam-follow" aria-pressed="true" title="Camera frames each event as it plays">Follow events</button>
    <div class="seg" id="cam-mode" role="group" aria-label="Camera mode"><button data-m="orbit" aria-pressed="true">Orbit</button><button data-m="recon">Recon</button><button data-m="follow" class="wide" title="Orbit locked to the selection">Track</button></div>
    <div class="seg" id="cam-view" role="group" aria-label="View"><button data-v="spatial" aria-pressed="true">3-D</button><button data-v="schematic">Schematic</button><button data-v="2d" title="2-D drawing (no WebGL needed)">2-D</button></div>
    <div class="seg" role="group" aria-label="Camera presets"><button id="cam-over" title="Overview (O)">Overview</button><button id="cam-top" class="wide" title="Plan view from above">Top</button><button id="cam-east" class="wide" title="View from the east">East</button></div>
    <div class="seg" role="group" aria-label="Zoom"><button id="cam-zin" aria-label="Zoom in (+)" title="Zoom in (+)">+</button><button id="cam-zout" aria-label="Zoom out (−)" title="Zoom out (−)">−</button></div>
    <button class="btn sm" id="cam-fs" title="Full screen (F11-style; Esc to leave)">Full screen</button>
  </div>
</footer>

<section class="ws" id="ws-quantum" data-ws="quantum" hidden aria-label="Quantum Lab"></section>
<section class="ws" id="ws-arena" data-ws="arena" hidden aria-label="Algorithm Arena"></section>
<section class="ws" id="ws-ml" data-ws="ml" hidden aria-label="ML Risk Observatory"></section>
<section class="ws" id="ws-evidence" data-ws="evidence" hidden aria-label="Evidence and Resource Lab"></section>

<button class="btn sm" id="fs-exit" hidden>Exit full screen</button>
<div id="toast" role="status" hidden></div>
<div id="tip" class="tip" hidden></div>
<div id="pop" role="dialog" aria-modal="false" hidden></div>
<div id="brief-ring" hidden></div><div id="brief" class="brief" role="dialog" aria-label="Briefing" hidden></div>
<div id="arrival" class="arrival" role="dialog" aria-modal="true" aria-label="Headline result" hidden></div>
<div id="help" class="modal" role="dialog" aria-modal="true" aria-labelledby="help-h" hidden><div class="card" id="help-card"></div></div>
<div id="cmdk" class="modal" role="dialog" aria-modal="true" aria-label="Command palette" hidden><div class="card"><input id="cmdk-in" placeholder="Type a command, a branch (branch 12), a bus (bus 69) or an experiment id…" autocomplete="off" aria-label="Command" role="combobox" aria-expanded="true" aria-controls="cmdk-list"><ul id="cmdk-list" role="listbox"></ul><div class="foot">↑ ↓ to move · Enter to run · Esc to close</div></div></div>
<div id="textout" class="modal" role="dialog" aria-modal="true" aria-labelledby="textout-h" hidden><div class="card"><div class="row" style="justify-content:space-between"><h3 id="textout-h">Export</h3><button class="btn sm" id="textout-x">Close</button></div><p class="note" id="textout-note"></p><div class="row" style="margin:8px 0"><button class="btn sm" id="textout-copy">Copy</button><button class="btn sm" id="textout-dl">Download file</button></div><textarea class="md" id="textout-ta" readonly aria-label="Exported text"></textarea></div></div>
<script type="module" src="js/main.js"></script>
</body>
